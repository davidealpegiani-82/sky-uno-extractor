name: Build Sky Extractor APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify shared HTML player template
        run: node android/scripts/verify-player-template.mjs
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Rename APK
        run: cp "android/app/build/outputs/apk/debug/app-debug.apk" "android/app/build/outputs/apk/debug/Sky Extractor.apk"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sky-Extractor
          path: "android/app/build/outputs/apk/debug/Sky Extractor.apk"
          if-no-files-found: error
          retention-days: 30
