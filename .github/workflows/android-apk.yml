name: Build DAVIX Android APKs

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify shared HTML player template
        run: node android/scripts/verify-player-template.mjs
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build both APKs
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug :playerlite:assembleDebug
      - name: Rename APKs
        run: |
          cp "android/app/build/outputs/apk/debug/app-debug.apk" "android/app/build/outputs/apk/debug/DAVIX-Extractor.apk"
          cp "android/playerlite/build/outputs/apk/debug/playerlite-debug.apk" "android/playerlite/build/outputs/apk/debug/DAVIX-Player.apk"
      - name: Upload DAVIX Extractor APK
        uses: actions/upload-artifact@v4
        with:
          name: DAVIX-Extractor
          path: "android/app/build/outputs/apk/debug/DAVIX-Extractor.apk"
          if-no-files-found: error
          retention-days: 30
      - name: Upload DAVIX Player APK
        uses: actions/upload-artifact@v4
        with:
          name: DAVIX-Player
          path: "android/playerlite/build/outputs/apk/debug/DAVIX-Player.apk"
          if-no-files-found: error
          retention-days: 30
      - name: Publish stable DAVIX Player APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: player-lite-latest
          name: DAVIX Player - ultima build
          prerelease: true
          make_latest: false
          files: |
            android/app/build/outputs/apk/debug/DAVIX-Extractor.apk
            android/playerlite/build/outputs/apk/debug/DAVIX-Player.apk
