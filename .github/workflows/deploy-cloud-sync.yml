name: Deploy Sky Cloud Sync

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cloud-sync/**"
      - ".github/workflows/deploy-cloud-sync.yml"

permissions:
  contents: read

concurrency:
  group: sky-cloud-sync-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloud-sync
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript check
        run: npm run typecheck

      - name: Apply D1 schema migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN repository secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID repository secret"; exit 1; }
          npx wrangler d1 migrations apply sky-cloud-sync --remote

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN repository secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID repository secret"; exit 1; }
          npx wrangler deploy

      - name: Configure Worker admin secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SKY_ADMIN_KEY: ${{ secrets.SKY_ADMIN_KEY }}
        run: |
          test -n "$SKY_ADMIN_KEY" || { echo "Missing SKY_ADMIN_KEY repository secret"; exit 1; }
          printf '%s' "$SKY_ADMIN_KEY" | npx wrangler secret put SKY_ADMIN_KEY
      - name: Verify Worker and D1 health
        env:
          SKY_CLOUD_SYNC_URL: https://sky-cloud-sync.davide-alpegiani.workers.dev
        run: |
          response="$(curl --fail --silent --show-error --retry 5 --retry-delay 2 "$SKY_CLOUD_SYNC_URL/health")"
          echo "$response"
          node -e 'const data = JSON.parse(process.argv[1]); if (!data.ok || !data.database?.ok || !data.database?.schemaReady) { console.error("Worker/D1 health check failed"); process.exit(1); } console.log("Worker online; D1 connection and schema verified.");' "$response"
