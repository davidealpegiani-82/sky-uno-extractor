<script>
'use strict';
let CHANNELS=[];
let CATEGORIES=[];
const CLOUD_SYNC_URL=__CLOUD_SYNC_URL__;
const APK_URL='https://github.com/davidealpegiani-82/sky-uno-extractor/releases/download/player-lite-latest/DAVIX-Player.apk';
const video=document.getElementById('video'),statusEl=document.getElementById('status'),bufferText=document.getElementById('bufferText'),bufferFill=document.getElementById('bufferFill');
const android=/Android/i.test(navigator.userAgent);
let hls=null,active=-1,retryTimer=null,networkRetryTimer=null,watchdog=null,retryCount=0,networkRetryCount=0,lastTime=0,lastProgress=Date.now(),recovering=false;
let startupPending=false,startupSince=0,lastLoadKick=0,lastHlsActivity=0,fragmentLoading=false,levelLoading=false;
const START_BUFFER_SECONDS=6,MIN_BUFFER_SECONDS=8,TARGET_BUFFER_SECONDS=30;
const retryDelays=[1000,2000,4000,8000,12000,15000];
function setStatus(s){statusEl.textContent=s}
function stopPlayer(){if(retryTimer){clearTimeout(retryTimer);retryTimer=null}if(watchdog){clearInterval(watchdog);watchdog=null}if(hls){try{hls.destroy()}catch(e){}hls=null}video.pause();video.removeAttribute('src');video.load();recovering=false;startupPending=false}
function bufferedAhead(){const t=video.currentTime||0;try{for(let i=0;i<video.buffered.length;i++){const a=video.buffered.start(i),b=video.buffered.end(i);if(t>=a-.5&&t<=b+.5)return Math.max(0,b-t)}}catch(e){}return 0}
function updateBuffer(){const s=bufferedAhead();bufferText.textContent=s.toFixed(1)+' s';bufferFill.style.width=Math.min(100,s/TARGET_BUFFER_SECONDS*100)+'%';bufferFill.style.background=s<15?'#f06b4a':s<MIN_BUFFER_SECONDS?'#f0a34a':'linear-gradient(90deg,#19b8df,#39dc9a)';return s}
function requestPlay(){startupPending=false;video.play().then(()=>{setStatus('In riproduzione: '+(CHANNELS[active]?.name||''))}).catch(()=>setStatus('Buffer pronto. Premi Play per avviare '+(CHANNELS[active]?.name||'')))}
function keepBufferLoading(force=false){
 if(!hls||active<0||fragmentLoading||levelLoading)return;
 const now=Date.now(),ahead=bufferedAhead();
 // Riattiva il loader solo se non ci sono richieste attive e HLS è davvero inattivo.
 if(!force||ahead>=TARGET_BUFFER_SECONDS||now-lastHlsActivity<5000||now-lastLoadKick<3000)return;
 lastLoadKick=now;
 try{hls.startLoad()}catch(e){}
}
function ensureHlsLoading(){
 if(!hls||active<0||fragmentLoading||levelLoading)return;
 const now=Date.now(),ahead=bufferedAhead();
 if(ahead>=TARGET_BUFFER_SECONDS||now-lastHlsActivity<5000||now-lastLoadKick<3000)return;
 keepBufferLoading(true);
}
function checkBufferPolicy(){
 const ahead=updateBuffer();
 if(startupPending){
  const waited=(Date.now()-startupSince)/1000;
  if(ahead>=START_BUFFER_SECONDS||(waited>=60&&ahead>=3)){requestPlay();return}
  setStatus('Precaricamento iniziale: '+ahead.toFixed(1)+' / '+START_BUFFER_SECONDS+' s');return;
 }
 if(!video.paused&&!video.ended&&ahead<MIN_BUFFER_SECONDS&&ahead<2)setStatus('Buffer basso: '+ahead.toFixed(1)+' s · attendo nuovi segmenti');
}
function beginPrebuffer(){startupPending=true;startupSince=Date.now();if(hls){try{hls.startLoad(-1)}catch(e){}}checkBufferPolicy()}
function recover(reason){if(retryTimer||active<0)return;if(retryCount>=retryDelays.length){setStatus('Flusso non disponibile dopo i tentativi automatici. Seleziona di nuovo il canale per riprovare.');return}const delay=retryDelays[retryCount++];recovering=true;setStatus(reason+' · ripristino '+retryCount+'/'+retryDelays.length);retryTimer=setTimeout(()=>{retryTimer=null;if(active>=0)startChannel(active,true)},delay)}
function recoverNetwork(reason){
 if(active<0||!hls||networkRetryTimer)return;
 const attempt=++networkRetryCount,delay=Math.min(1000*Math.pow(2,Math.min(attempt-1,2)),4000);
 recovering=true;setStatus(reason+' · riattivazione automatica '+attempt);
 networkRetryTimer=setTimeout(()=>{
  networkRetryTimer=null;if(!hls||active<0)return;
  try{lastLoadKick=Date.now();hls.startLoad()}catch(e){recovering=false;setStatus('Riattivazione HLS in corso…')}
 },delay);
}
function startWatchdog(){
 if(watchdog)clearInterval(watchdog);lastTime=video.currentTime||0;lastProgress=Date.now();
 watchdog=setInterval(()=>{
  if(video.paused||video.ended||active<0)return;
  const t=video.currentTime||0,ahead=bufferedAhead(),now=Date.now();
  if(Math.abs(t-lastTime)>=.2){lastTime=t;lastProgress=now;if(!recovering)retryCount=0;return}
  if(now-lastProgress>25000&&ahead<1&&!fragmentLoading&&now-lastHlsActivity>10000)recoverNetwork('Flusso fermo e buffer esaurito');
 },5000)
}
function startChannel(i,retry=false){const c=CHANNELS[i];if(!c)return;active=i;if(retryTimer){clearTimeout(retryTimer);retryTimer=null}if(networkRetryTimer){clearTimeout(networkRetryTimer);networkRetryTimer=null}networkRetryCount=0;if(hls){try{hls.destroy()}catch(e){}hls=null}fragmentLoading=false;levelLoading=false;lastHlsActivity=Date.now();video.pause();video.removeAttribute('src');video.load();startupPending=false;lastLoadKick=0;document.querySelectorAll('.channel').forEach((b,n)=>b.classList.toggle('active',n===i));setStatus((retry?'Ripristino: ':'Caricamento: ')+c.name);
 if(video.canPlayType('application/vnd.apple.mpegurl')&&!(window.Hls&&Hls.isSupported())){video.src=c.url;video.load();beginPrebuffer()}
 else if(window.Hls&&Hls.isSupported()){hls=new Hls({enableWorker:true,lowLatencyMode:false,liveSyncDurationCount:8,liveMaxLatencyDurationCount:24,maxBufferLength:90,maxMaxBufferLength:90,maxBufferSize:90*1000*1000,backBufferLength:30,maxBufferHole:.1,highBufferWatchdogPeriod:2,startFragPrefetch:true,testBandwidth:true,abrEwmaDefaultEstimate:2000000,abrBandWidthFactor:.8,abrBandWidthUpFactor:.7,fragLoadingTimeOut:45000,manifestLoadingTimeOut:30000,manifestLoadingMaxRetry:6,levelLoadingMaxRetry:6,fragLoadingMaxRetry:8,fragLoadingRetryDelay:1000,fragLoadingMaxRetryTimeout:45000,nudgeMaxRetry:6,debug:false});hls.on(Hls.Events.MANIFEST_PARSED,()=>{lastHlsActivity=Date.now();beginPrebuffer()});hls.on(Hls.Events.LEVEL_LOADING,()=>{levelLoading=true;lastHlsActivity=Date.now()});hls.on(Hls.Events.LEVEL_LOADED,()=>{levelLoading=false;lastHlsActivity=Date.now()});hls.on(Hls.Events.FRAG_LOADING,()=>{fragmentLoading=true;lastHlsActivity=Date.now()});hls.on(Hls.Events.FRAG_LOADED,()=>{fragmentLoading=false;lastHlsActivity=Date.now()});hls.on(Hls.Events.FRAG_BUFFERED,()=>{fragmentLoading=false;lastHlsActivity=Date.now();networkRetryCount=0;recovering=false;checkBufferPolicy()});hls.on(Hls.Events.ERROR,(_,e)=>{if(e){if(e.details===Hls.ErrorDetails.FRAG_LOAD_ERROR||e.details===Hls.ErrorDetails.FRAG_LOAD_TIMEOUT){fragmentLoading=false;levelLoading=false;lastHlsActivity=Date.now()}if(e.fatal){if(e.type===Hls.ErrorTypes.NETWORK_ERROR){recoverNetwork('Errore di rete')}else if(e.type===Hls.ErrorTypes.MEDIA_ERROR){try{hls.recoverMediaError()}catch(_){recover('Errore del flusso')}}else recover('Errore del flusso')}}});hls.loadSource(c.url);hls.attachMedia(video)}
 else setStatus('HLS non supportato da questo browser. Usa Apri con DAVIX Player su Android.');
 startWatchdog();updateBuffer()}
function openLite(){
 if(active<0||!CHANNELS[active]){setStatus('Seleziona prima un canale.');return}
 const c=CHANNELS[active],q=new URLSearchParams({url:c.url,name:c.name});
 // Passa al player nativo il contesto HTTP reale del browser. Il browser aggiunge
 // automaticamente User-Agent e Origin alle richieste HLS cross-origin; Media3 no.
 try{
  const pageUrl=new URL(location.href),streamUrl=new URL(c.url);
  if(navigator.userAgent)q.set('ua',navigator.userAgent);
  if(pageUrl.origin)q.set('origin',pageUrl.origin);
  // Rispetta la referrer policy predefinita strict-origin-when-cross-origin.
  if(pageUrl.protocol==='http:'||pageUrl.protocol==='https:'){
   if(!(pageUrl.protocol==='https:'&&streamUrl.protocol==='http:')){
    const referrer=pageUrl.origin===streamUrl.origin?pageUrl.href:(pageUrl.origin==='null'?'':pageUrl.origin+'/');
    if(referrer)q.set('referer',referrer);
   }
  }
 }catch(e){}
 location.href='intent://play?'+q.toString()+'#Intent;scheme=skylite;package=it.davidealpegiani.skylite;S.browser_fallback_url='+encodeURIComponent(APK_URL)+';end'
}
document.getElementById('openLite').addEventListener('click',openLite);
const videoStage=document.getElementById('videoStage'),fullscreenBtn=document.getElementById('fullscreenBtn');
async function toggleFullscreen(){try{if(document.fullscreenElement){await document.exitFullscreen()}else if(videoStage.requestFullscreen){await videoStage.requestFullscreen()}else if(video.webkitEnterFullscreen){video.webkitEnterFullscreen()}else{setStatus('Schermo intero non supportato da questo browser.')}}catch(e){if(video.webkitEnterFullscreen){try{video.webkitEnterFullscreen()}catch(_){setStatus('Impossibile attivare lo schermo intero.')}}else setStatus('Impossibile attivare lo schermo intero.')}}
fullscreenBtn.addEventListener('click',toggleFullscreen);
document.addEventListener('fullscreenchange',()=>{fullscreenBtn.textContent=document.fullscreenElement?'⤢ Esci da schermo intero':'⛶ Schermo intero'});
video.addEventListener('playing',()=>{lastTime=video.currentTime||0;lastProgress=Date.now();if(!startupPending)setStatus('In riproduzione: '+(CHANNELS[active]?.name||''))});
video.addEventListener('timeupdate',()=>{const t=video.currentTime||0;if(Math.abs(t-lastTime)>=.2){lastTime=t;lastProgress=Date.now()}checkBufferPolicy()});
video.addEventListener('progress',checkBufferPolicy);video.addEventListener('waiting',()=>{if(!video.paused){setStatus('Buffering: attendo il prossimo segmento…');if(bufferedAhead()<1)keepBufferLoading(true)}checkBufferPolicy()});video.addEventListener('error',()=>{if(active>=0)recover('Errore di riproduzione')});
const list=document.getElementById('list');
const cloudButton=document.getElementById('cloudPair');
const cloudStatus=document.getElementById('cloudStatus');
const CLOUD_STORAGE_KEY='sky-player-cloud-sync-v2';
const activationInput=document.getElementById('activationCode');
let lastCloudCheck=0;
function cloudState(){try{return JSON.parse(localStorage.getItem(CLOUD_STORAGE_KEY)||'{}')}catch(e){return {}}}
function saveCloudState(value){try{localStorage.setItem(CLOUD_STORAGE_KEY,JSON.stringify(value));return true}catch(e){return false}}
function openKeyDb(){return new Promise((resolve,reject)=>{const req=indexedDB.open('sky-player-key-store',1);req.onupgradeneeded=()=>req.result.createObjectStore('keys');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function getDeviceSecret(state){if(state.deviceSecret)return state.deviceSecret;if(!state.secretCipher||!window.crypto?.subtle||!window.indexedDB)return null;const db=await openKeyDb();const key=await new Promise((resolve,reject)=>{const tx=db.transaction('keys','readonly'),req=tx.objectStore('keys').get('device-key');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});db.close();if(!key)return null;const packed=Uint8Array.from(atob(state.secretCipher),c=>c.charCodeAt(0)),iv=packed.slice(0,12),cipher=packed.slice(12);const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,cipher);return new TextDecoder().decode(plain)}
async function storeDeviceSecret(state,secret){try{if(!window.crypto?.subtle||!window.indexedDB)throw new Error('secure storage unavailable');const db=await openKeyDb();let key=await new Promise((resolve,reject)=>{const tx=db.transaction('keys','readonly'),req=tx.objectStore('keys').get('device-key');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});if(!key){key=await crypto.subtle.generateKey({name:'AES-GCM',length:256},false,['encrypt','decrypt']);await new Promise((resolve,reject)=>{const tx=db.transaction('keys','readwrite');tx.objectStore('keys').put(key,'device-key');tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}const iv=crypto.getRandomValues(new Uint8Array(12)),cipher=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(secret));const packed=new Uint8Array(iv.length+cipher.byteLength);packed.set(iv);packed.set(new Uint8Array(cipher),iv.length);state.secretCipher=btoa(String.fromCharCode(...packed));delete state.deviceSecret;db.close()}catch(e){state.deviceSecret=secret}return state}
function clearCloudAuthorization(){try{localStorage.removeItem(CLOUD_STORAGE_KEY);if(window.indexedDB){const req=indexedDB.deleteDatabase('sky-player-key-store');req.onerror=()=>{}}}catch(e){}CHANNELS=[];CATEGORIES=[];stopPlayer();active=-1;renderChannels(false);activationInput.hidden=false;cloudButton.hidden=false;cloudStatus.textContent='Autorizzazione revocata o non valida. Serve un nuovo codice.'}
function randomToken(){const bytes=new Uint8Array(32);crypto.getRandomValues(bytes);let raw='';bytes.forEach(v=>raw+=String.fromCharCode(v));return btoa(raw).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function randomId(){const bytes=new Uint8Array(16);crypto.getRandomValues(bytes);return Array.from(bytes,v=>v.toString(16).padStart(2,'0')).join('')}
async function cloudRequest(path,options={}){const res=await fetch(CLOUD_SYNC_URL+path,options);let data={};try{data=await res.json()}catch(e){}if(!res.ok)throw new Error(data.error||('HTTP '+res.status));return data}
function renderChannels(autoStart=false){
 list.innerHTML='';
 if(!CHANNELS.length){list.innerHTML='<div class="list-title">TUTTI I CANALI</div>';setStatus('Attiva questo dispositivo con un codice monouso per visualizzare i canali.');return}
 const ordered=[...new Set([...CATEGORIES,...CHANNELS.map(c=>c.category||'Non classificati')].filter(Boolean))];
 const appendChannel=(c,i)=>{const row=document.createElement('div');row.className='row';const b=document.createElement('button');b.type='button';b.className='channel';b.setAttribute('aria-label','Riproduci '+c.name);const logo=document.createElement('span');logo.className='logo';if(c.logo){const img=document.createElement('img');img.alt='';img.loading='lazy';img.src=c.logo;img.onerror=()=>{logo.textContent=(c.name||'TV').charAt(0).toUpperCase()};logo.appendChild(img)}else logo.textContent=(c.name||'TV').charAt(0).toUpperCase();const name=document.createElement('span');name.className='name';name.textContent=c.name;const live=document.createElement('span');live.className='live';live.textContent='LIVE';b.append(logo,name,live);b.addEventListener('click',()=>{if(!hasValidLease()){setStatus('Attivazione richiesta.');return}retryCount=0;startChannel(i)});row.appendChild(b);if(android){const app=document.createElement('button');app.type='button';app.className='native';app.textContent='APP';app.setAttribute('aria-label','Apri '+c.name+' in DAVIX Player');app.addEventListener('click',()=>{if(!hasValidLease())return;active=i;openLite()});row.appendChild(app)}list.appendChild(row)};
 const roots=[...new Set(paths.map(path=>path.split('>').map(part=>part.trim()).filter(Boolean)[0]).filter(Boolean))];
 const rendered=new Set();
 roots.forEach(root=>{
  const rootItems=CHANNELS.map((c,i)=>({c,i})).filter(x=>(x.c.category||'Non classificati').trim()===root);
  const children=paths.filter(path=>path.startsWith(root+' > ')).sort((a,b)=>a.localeCompare(b));
  if(!rootItems.length&&!children.some(path=>CHANNELS.some(c=>(c.category||'').trim()===path)))return;
  const heading=document.createElement('div');heading.className='category-title';heading.textContent=root;list.appendChild(heading);
  rootItems.forEach(x=>{appendChannel(x.c,x.i);rendered.add(x.i)});
  children.forEach(path=>{
   const items=CHANNELS.map((c,i)=>({c,i})).filter(x=>(x.c.category||'').trim()===path);
   if(!items.length)return;
   const depth=path.split('>').length-1,leaf=path.split('>').pop().trim();
   const sub=document.createElement('div');sub.className='category-title';sub.style.paddingLeft=(5+depth*18)+'px';sub.textContent='›  '+leaf;list.appendChild(sub);
   items.forEach(x=>{appendChannel(x.c,x.i);rendered.add(x.i)});
  });
 });
 CHANNELS.forEach((c,i)=>{if(!rendered.has(i))appendChannel(c,i)});
 if(autoStart)startChannel(0)
}
function hasValidLease(){const state=cloudState();return !!(state.deviceSecret||state.secretCipher)&&Number(state.leaseExpiresAt||0)>Date.now()}
async function syncCloudConfig(){if(!CLOUD_SYNC_URL||!hasValidLease())return;lastCloudCheck=Date.now();const state=cloudState();try{const deviceSecret=await getDeviceSecret(state);if(!deviceSecret)throw new Error('device_credential_missing');const data=await cloudRequest('/v1/config?sinceVersion='+(state.version||0),{headers:{Authorization:'Bearer '+deviceSecret}});const leaseExpiresAt=Number(data.leaseExpiresAt||0);if(leaseExpiresAt<=Date.now())throw new Error('offline_lease_expired');if(data.unchanged){saveCloudState({...state,leaseExpiresAt});cloudStatus.textContent='Lista aggiornata · licenza rinnovata';return}const incoming=data.config&&data.config.channels;const incomingCategories=data.config&&Array.isArray(data.config.categories)?data.config.categories:[];if(!Array.isArray(incoming)||incoming.length>1000||!incoming.every(c=>c&&typeof c.name==='string'&&typeof c.url==='string'&&/^https?:\/\//i.test(c.url))||incomingCategories.length>100||!incomingCategories.every(c=>typeof c==='string'&&c.trim().length>0&&c.length<=80)){throw new Error('Configurazione ricevuta non valida')}CHANNELS=incoming;CATEGORIES=incomingCategories;saveCloudState({...state,version:data.version,config:data.config,leaseExpiresAt});stopPlayer();active=-1;renderChannels(false);cloudStatus.textContent='Lista autorizzata · '+incoming.length+' canali'}catch(e){if(String(e.message||'').includes('device_not_authorized')||String(e.message||'').includes('offline_lease_expired')){clearCloudAuthorization();return}const cached=cloudState();if(Number(cached.leaseExpiresAt||0)<=Date.now()){clearCloudAuthorization();return}cloudStatus.textContent='Offline: uso la configurazione autorizzata fino alla scadenza della licenza.'}}
async function pairCloudPlayer(){if(!CLOUD_SYNC_URL){cloudStatus.textContent='Cloud Sync non configurato nell’esportazione.';return}try{const code=activationInput.value.trim().toUpperCase().replace(/[^A-Z0-9]/g,'');if(!/^[A-HJ-NP-Z2-9]{10}$/.test(code)){activationInput.focus();throw new Error('Inserisci il codice monouso di 10 caratteri generato da DAVIX Extractor.')}const state=cloudState();const deviceSecret=await getDeviceSecret(state)||randomToken(),installId=state.installId||randomId();const activated=await cloudRequest('/v2/activate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code,deviceSecret,installId,deviceName:(navigator.userAgent||'Browser').slice(0,100),platform:'html'})});if(!activated.activated||Number(activated.leaseExpiresAt)<=Date.now())throw new Error('Attivazione non confermata dal server');const secureState=await storeDeviceSecret({installId,version:0,leaseExpiresAt:activated.leaseExpiresAt,config:null},deviceSecret);if(!saveCloudState(secureState))throw new Error('Impossibile salvare l’autorizzazione locale');activationInput.hidden=true;cloudButton.hidden=true;cloudStatus.textContent='Dispositivo attivato. Caricamento configurazione…';await syncCloudConfig()}catch(e){cloudStatus.textContent=e.message||'Attivazione non riuscita.'}}
cloudButton.hidden=false;
cloudButton.textContent='ATTIVA DISPOSITIVO';
cloudButton.addEventListener('click',pairCloudPlayer);
const cached=cloudState();
if(Number(cached.leaseExpiresAt||0)>Date.now()&&(Array.isArray(cached.config)||Array.isArray(cached.config&&cached.config.channels))){const saved=Array.isArray(cached.config)?{channels:cached.config,categories:[]}:cached.config;CHANNELS=saved.channels;CATEGORIES=Array.isArray(saved.categories)?saved.categories:[];activationInput.hidden=true;cloudButton.hidden=true;renderChannels(false);cloudStatus.textContent='Configurazione autorizzata disponibile offline.';if(CLOUD_SYNC_URL)syncCloudConfig()}else{clearCloudAuthorization();activationInput.hidden=false;cloudButton.hidden=false}
setInterval(()=>{if(!hasValidLease()&&CHANNELS.length)clearCloudAuthorization();else if(hasValidLease()&&Date.now()-lastCloudCheck>6*60*60*1000)syncCloudConfig();ensureHlsLoading();checkBufferPolicy()},1500);
</script></body></html>
